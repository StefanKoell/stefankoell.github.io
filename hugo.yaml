baseURL: https://code4ward.net/
title: code4ward.net

enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
hasCJKLanguage: true

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
  en:
    label: English
    locale: en
    weight: 1
    title: code4ward.net
    params:
      tagline: Stuff nobody is interested in...

pagination:
  pagerSize: 10

taxonomies:
  tag: tags

outputs:
  home:
    - HTML
    - RSS
    - JSON
  section:
    - HTML
    - RSS

params:
  theme_version: 1.0.3
  toc: true
  avatar: img/profile.jpg
  author: Stefan Koell

  assets:
    self_host: false

  social:
    name: Stefan Koell
    url: https://code4ward.net/
    links:
      - type: github
        id: StefanKoell
        icon: fab fa-github
      - type: mastodon
        url: https://dotnet.social/@stefankoell
        icon: fab fa-mastodon
        noblank: true
      - type: bluesky
        url: https://bsky.app/profile/stefankoell.bsky.social
        icon: fab fa-bluesky
      - type: twitter
        id: stefankoell
        icon: fab fa-x-twitter
      - type: linkedin
        url: https://www.linkedin.com/in/stefankoell
        icon: fab fa-linkedin
      - type: rss
        icon: fas fa-rss
        noblank: true

  comments:
    enable: true
    provider: giscus
    giscus:
      repo: StefanKoell/stefankoell.github.io
      repo_id: R_kgDOK_HhAQ
      category: General
      category_id: DIC_kwDOK_HhAc4CcF6-
      mapping: pathname
      strict: 0
      reactions_enabled: 1
      input_position: bottom
      lang: en

module:
  imports:
    - path: github.com/StefanKoell/hugo-theme-chirpy
  hugoVersion:
    extended: true
    min: 0.164.0

markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
        title: true
    renderer:
      unsafe: true
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: true
    noClasses: false
    tabWidth: 4
    wrapperClass: highlight

enableInlineShortcodes: true
